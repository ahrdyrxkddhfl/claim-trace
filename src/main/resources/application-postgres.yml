# =============================================================
# PostgreSQL 프로파일
#
# 접속 정보는 담지 않는다. 테스트가 Testcontainers 로 띄운 컨테이너의
# 주소를 실행 시점에 주입하므로, 여기에는 프로파일이 달라질 때 바뀌는
# 항목만 둔다.
#
# 이 프로파일의 목적은 성능 비교가 아니라, INV-12 를 DB 제약으로 강제할 수
# 있음을 실제 DBMS 에서 보이는 것이다. H2 는 부분 UNIQUE 인덱스를 지원하지
# 않아 같은 검증을 할 수 없다.
# =============================================================

spring:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      # Hibernate DDL → schema-locations → data-locations 순으로 실행된다.
      # 부분 UNIQUE 인덱스가 시드 적재보다 먼저 걸려야, 시드 자체가 조건을
      # 만족하는지도 함께 검증된다.
      schema-locations: classpath:schema-postgres.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: false

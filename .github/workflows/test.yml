name: test

# 푸시와 PR 마다 전체 테스트를 실행한다.
#
# 이 저장소가 주장하는 것은 "설계 불변조건을 코드가 강제하고 테스트가 그것을
# 확인한다"이다. 테스트가 실제로 통과하는지를 저장소 밖에서 확인할 수단이
# 없으면 그 주장은 검증되지 않은 채로 남는다.
#
# PostgreSQL 검증은 Testcontainers 로 컨테이너를 띄운다. GitHub 호스티드
# 러너에는 Docker 가 설치되어 있어 별도 설정 없이 동작한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 테스트 76개
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      # 실패했을 때 어느 테스트가 왜 깨졌는지 확인할 수 있어야 한다.
      # 성공한 경우에도 올려 두면 검증 결과를 남길 수 있다.
      - name: 테스트 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

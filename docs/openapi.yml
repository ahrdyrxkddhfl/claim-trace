openapi: 3.0.3

info:
  title: CLAIM-TRACE API
  version: "1.0.0"
  description: |
    보험금 지급심사 근거 추적 및 인적 개입 기록 시스템의 REST API.

    ## 설계 목표
    - **G1** AI 권고와 사람 판정을 물리적으로 분리해 기록한다
    - **G2** 판단 근거를 항목 단위로, 채택된 것과 기각된 것 모두 남긴다
    - **G3** 근거를 내부용과 고객용 두 수준으로 분리해 노출한다
    - **G4** 인적 개입 조건을 정책으로 정의하고 그 이행을 강제한다

    ## 규제 대응 단일 진입점
    아래 세 엔드포인트에 불변조건 검증이 모인다. 우회 경로를 두지 않는다.

    | 엔드포인트 | 검증 |
    |---|---|
    | `POST /claim-items/{itemId}/reviews` | INV-1, INV-2, INV-3, INV-12 |
    | `POST /claims/{claimId}/decision` | INV-4, INV-10 |
    | `POST /claims/{claimId}/explanations/draft` | INV-5 |

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601
    - 목록 API는 `page`, `size` 쿼리 파라미터를 받고 `PagedResponse` 구조로 반환한다
    - 모든 오류 응답은 공통 `Error` 스키마를 사용한다
    - Security Schemes는 과제 평가 대상에서 제외되어 정의하지 않는다

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증
  - name: Portal
    description: 청구인 · 고객 포털
  - name: Reviewer
    description: 심사자 · 사내 콘솔
  - name: Admin
    description: 심사관리자 · 정책과 통제
  - name: External
    description: 외부시스템 연계 (화면 없음)

paths:

  # ══════════════════════════════════════════════
  # Auth
  # ══════════════════════════════════════════════

  /auth/internal/login:
    post:
      tags: [Auth]
      summary: 사내 로그인
      description: 화면 7. 성공 시 role에 따라 진입 화면이 분기된다.
      operationId: loginInternal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empNo, password]
              properties:
                empNo: { type: string, example: "M2026043" }
                password: { type: string, format: password }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/portal/login:
    post:
      tags: [Auth]
      summary: 고객 포털 로그인
      description: 화면 1
      operationId: loginPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string, example: "kimcs85" }
                password: { type: string, format: password }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ══════════════════════════════════════════════
  # Portal
  # ══════════════════════════════════════════════

  /portal/claims:
    get:
      tags: [Portal]
      summary: 내 청구 목록
      description: 화면 2. 본인 청구만 반환한다 (INV-6).
      operationId: listMyClaims
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ClaimSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Portal]
      summary: 청구 접수
      description: |
        화면 3. 서류를 첨부해 청구를 접수한다.
        접수된 서류의 OCR 결과로 `claim_items`가 생성된다 (D-8).
      operationId: submitClaim
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [policyId, coverageIds, hospitalName, treatedFrom, treatedTo, files, agreePrivacy, agreeAi]
              properties:
                policyId: { type: integer, format: int64 }
                coverageIds:
                  type: array
                  items: { type: integer, format: int64 }
                hospitalName: { type: string, maxLength: 100 }
                treatedFrom: { type: string, format: date }
                treatedTo: { type: string, format: date }
                customerMemo: { type: string }
                agreePrivacy: { type: boolean, description: 개인정보·민감정보 수집 이용 동의 }
                agreeAi: { type: boolean, description: AI 활용 심사 동의 }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: 접수 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimSummary' }
        '400':
          description: |
            소멸시효 경과 (E-9) · 동의 항목 누락 · 필수 서류 미첨부
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                prescribed:
                  summary: 소멸시효 경과
                  value:
                    code: CLAIM_PRESCRIBED
                    message: 지급사유 발생일로부터 3년이 경과하여 접수할 수 없습니다
                    invariant: E-9
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/policies/my:
    get:
      tags: [Portal]
      summary: 내 계약·담보 조회
      description: 화면 3. 청구 가능한 계약과 담보 목록.
      operationId: listMyPolicies
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /portal/claims/{claimId}:
    get:
      tags: [Portal]
      summary: 청구 상세 및 항목별 판정 사유
      description: |
        화면 4.
        `disclosure_level = CUSTOMER`인 근거만 반환한다. 내부용 근거는 응답에서 제외된다 (INV-9).
        `is_current = true`인 판정만 반환한다 (INV-12).
      operationId: getMyClaim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetailCustomer' }
        '403':
          description: 타인의 청구 조회 시도 (E-8)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /portal/claims/{claimId}/explanations:
    get:
      tags: [Portal]
      summary: 설명서 상태·수령
      description: 화면 5. 전역 설명과 국소 설명을 함께 반환한다.
      operationId: listMyExplanations
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Explanation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Portal]
      summary: 국소 설명서 발급 신청
      description: |
        화면 5. 신청 시 제공 기한을 산정해 응답에 포함한다 (INV-8).
      operationId: requestExplanation
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '201':
          description: 신청 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 신청된 국소 설명서가 존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /portal/claims/{claimId}/objections:
    get:
      tags: [Portal]
      summary: 이의제기 진행·회신 조회
      description: 화면 6
      operationId: listMyObjections
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Objection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Portal]
      summary: 이의제기 제출
      description: |
        화면 6. 전액 지급된 항목은 대상으로 선택할 수 없다.
        접수 시 최초 판정자가 아닌 심사자에게 배정된다.
      operationId: submitObjection
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetItemIds, reason]
              properties:
                targetItemIds:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: 접수 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objection' }
        '400':
          description: 전액 지급 항목 선택 · 사유 미기재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════
  # Reviewer
  # ══════════════════════════════════════════════

  /reviews/queue:
    get:
      tags: [Reviewer]
      summary: 배정 심사 큐
      description: 화면 8. 본인에게 배정된 청구만 반환한다 (INV-6).
      operationId: getReviewQueue
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ClaimStatus' }
        - name: coverageType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CoverageType' }
        - name: minProbability
          in: query
          required: false
          description: 항목별 보상제외 확률 최댓값의 하한
          schema: { type: number, format: double, minimum: 0, maximum: 1 }
        - name: dualCheckOnly
          in: query
          required: false
          description: 복수인 확인 대상만 조회
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/QueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /claims/{claimId}:
    get:
      tags: [Reviewer]
      summary: 청구 상세 (내부용 전체)
      description: 화면 9. 내부용 근거를 포함한 전체 정보를 반환한다.
      operationId: getClaim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetailInternal' }
        '403':
          description: 타 심사자 배정 건 접근 (E-5)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{claimId}/items:
    get:
      tags: [Reviewer]
      summary: 항목 목록 및 AI 권고
      description: 화면 9. 항목별 최신 AI 권고와 현재 판정을 함께 반환한다.
      operationId: listClaimItems
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClaimItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{claimId}/documents:
    get:
      tags: [Reviewer]
      summary: 제출 서류 목록 및 OCR 결과
      description: 화면 9, 10
      operationId: listClaimDocuments
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /claim-items/{itemId}/reviews:
    get:
      tags: [Reviewer]
      summary: 항목 판정 이력
      description: |
        화면 9. 재검토 이력을 포함한 전체 판정을 시간 역순으로 반환한다.
        `isCurrent = true`인 레코드는 정확히 1건이다 (INV-12).
      operationId: listItemReviews
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Reviewer]
      summary: 항목 판정 저장 (단일 진입점)
      description: |
        화면 9. 판정을 저장한다. 호출마다 새 레코드가 적재되고 `isCurrent`가 이관된다.

        **같은 트랜잭션에서 수행되는 것**
        1. 기존 `is_current = true` 레코드를 `false`로 전환하고 `superseded_by`를 연결
        2. 새 `reviews` 레코드 생성 (INV-1, INV-2, INV-12)
        3. 최신 `ai_recommendations.recommendation`과 `decision`을 비교
        4. 다르면 `interventions` 레코드를 `type = OVERRIDE`로 생성 (D-7, INV-3)

        검증에 실패하면 트랜잭션 전체가 롤백된다.
      operationId: saveItemReview
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '201':
          description: 판정 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          description: 판정 사유 미기재 (E-1) · 오버라이드 사유 미기재 (E-2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noReason:
                  summary: 판정 사유 미기재
                  value:
                    code: REVIEW_REASON_REQUIRED
                    message: 판정 사유를 입력해야 저장할 수 있습니다
                    invariant: INV-2
                noOverrideReason:
                  summary: 오버라이드 사유 미기재
                  value:
                    code: OVERRIDE_REASON_REQUIRED
                    message: AI 권고와 다른 판정에는 오버라이드 사유가 필요합니다
                    invariant: INV-3
                    details:
                      recommendation: DENY
                      decision: PARTIAL
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 확정된 청구의 항목 (INV-7)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claim-items/{itemId}/evidences:
    get:
      tags: [Reviewer]
      summary: 근거 카드 목록
      description: 화면 10. 내부용 근거를 포함한 전체 근거를 반환한다.
      operationId: listItemEvidences
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evidence' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Reviewer]
      summary: 심사자 근거 직접 추가
      description: 화면 10. `source = MANUAL`로 생성되며 상태는 즉시 `ADOPTED`다.
      operationId: addManualEvidence
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [polarity, contentInternal, disclosureLevel]
              properties:
                polarity: { $ref: '#/components/schemas/Polarity' }
                contentInternal: { type: string, minLength: 1 }
                contentCustomer: { type: string }
                disclosureLevel: { $ref: '#/components/schemas/DisclosureLevel' }
                documentId: { type: integer, format: int64 }
                targetAmount: { type: integer }
      responses:
        '201':
          description: 근거 추가 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 이미 확정된 청구 (E-6, INV-7)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /evidences/{evidenceId}/status:
    put:
      tags: [Reviewer]
      summary: 근거 채택·기각
      description: |
        화면 10. 근거의 상태를 전이시킨다.
        `REJECTED`로 전이할 때 `rejectionReasonType`이 필수다 (INV-11).
        기각된 근거는 삭제되지 않고 사유와 함께 보존된다 (D-3).
      operationId: updateEvidenceStatus
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/EvidenceStatus' }
                rejectionReasonType: { $ref: '#/components/schemas/RejectionReasonType' }
                rejectionNote: { type: string }
                disclosureLevel: { $ref: '#/components/schemas/DisclosureLevel' }
      responses:
        '200':
          description: 상태 변경 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400':
          description: 기각 사유 미선택 (E-10)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noRejectionReason:
                  value:
                    code: REJECTION_REASON_REQUIRED
                    message: 근거를 기각하려면 기각 사유를 선택해야 합니다
                    invariant: INV-11
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 확정된 청구의 근거 (E-6, INV-7)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claims/{claimId}/decision:
    post:
      tags: [Reviewer]
      summary: 청구 판정 확정 (단일 진입점)
      description: |
        화면 9. 청구 전체의 판정을 확정하고 `claims.status`를 `DECIDED`로 전이시킨다.

        **확정 전 검증**
        - 모든 항목에 `is_current = true`인 판정이 존재하는가 (INV-10)
        - 개입 정책에 해당하는 경우 승인이 완료되었는가 (INV-4)

        확정 이후 근거와 판정은 변경할 수 없다 (INV-7).
      operationId: confirmDecision
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResult' }
        '400':
          description: 미판정 항목 존재 (E-9)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pendingItems:
                  value:
                    code: PENDING_ITEMS_EXIST
                    message: 판정되지 않은 항목이 있어 확정할 수 없습니다
                    invariant: INV-10
                    details:
                      pendingItemIds: [1203, 1204]
        '403':
          description: 복수인 확인 미승인 (E-4) · 타 심사자 배정 건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                dualCheckRequired:
                  value:
                    code: DUAL_CHECK_REQUIRED
                    message: 복수인 확인 승인이 완료되어야 확정할 수 있습니다
                    invariant: INV-4
                    details:
                      policyCode: P-07
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 확정된 청구
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claims/{claimId}/explanations/draft:
    post:
      tags: [Reviewer]
      summary: 고객 설명문 초안 생성 (단일 진입점)
      description: |
        화면 11. `disclosureLevel = CUSTOMER`인 채택 근거만으로 초안을 생성한다.

        **생성 전 검증**
        - 부지급·일부지급 항목에 부정적 판단 사유가 1건 이상 포함되는가 (INV-5)

        초안은 심사자가 검토·확정해야 고객에게 발급된다. 완전 자동 발급은 없다.
      operationId: draftExplanation
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '201':
          description: 초안 생성 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '400':
          description: 부정적 판단 사유 부재 (E-3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noNegativeEvidence:
                  value:
                    code: NEGATIVE_EVIDENCE_REQUIRED
                    message: 부지급 항목에 고객용 부정 근거가 없어 설명서를 생성할 수 없습니다
                    invariant: INV-5
                    details:
                      itemId: 1203
                      decision: DENY
                      customerNegativeCount: 0
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /explanations/{explanationId}:
    put:
      tags: [Reviewer]
      summary: 설명문 수정·확정
      description: |
        화면 11. 초안을 수정하고 확정한다.
        확정 시 `status`가 `PROVIDED`로 전이하며 고객에게 노출된다.
      operationId: updateExplanation
      parameters:
        - name: explanationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, confirm]
              properties:
                body: { type: string, minLength: 1 }
                confirm:
                  type: boolean
                  description: true면 확정 발급, false면 임시 저장
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objections/{objectionId}/response:
    put:
      tags: [Reviewer]
      summary: 이의제기 재검토 결과 회신
      description: |
        화면 9. 재검토 결과를 회신한다.
        판정이 바뀐 경우 새 `reviews` 레코드가 생성되며 최초 판정은 이력으로 보존된다 (D-6).
      operationId: respondObjection
      parameters:
        - name: objectionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, minLength: 1 }
      responses:
        '200':
          description: 회신 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Objection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 최초 판정자는 재검토할 수 없음 (직무 분리)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════
  # Admin
  # ══════════════════════════════════════════════

  /admin/intervention-policies:
    get:
      tags: [Admin]
      summary: 개입 정책 목록
      description: 화면 12
      operationId: listPolicies
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InterventionPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Admin]
      summary: 개입 정책 등록
      description: 화면 12
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterventionPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/intervention-policies/{policyId}:
    put:
      tags: [Admin]
      summary: 개입 정책 수정
      description: |
        화면 12. 조건 변경은 기존 판정에 소급 적용되지 않는다.
      operationId: updatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterventionPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/interventions:
    get:
      tags: [Admin]
      summary: 개입 이력 조회
      description: 화면 13
      operationId: listInterventions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InterventionType' }
        - name: actorId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: pendingApprovalOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Intervention' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/interventions/summary:
    get:
      tags: [Admin]
      summary: 개입 집계
      description: |
        화면 13. 심사자별 지표와 근거 기각 사유 집계를 반환한다.
        자동화 편향 측정을 위한 지표이며, 특정 값이 편향을 의미한다고 단정하지 않는다.
        기각 사유 집계는 룰·모델 개선의 입력이 된다 (기술서 1.7 ③).
      operationId: getInterventionSummary
      parameters:
        - name: days
          in: query
          required: false
          description: 집계 기간 (일)
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterventionSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/claims/{claimId}/dual-check:
    put:
      tags: [Admin]
      summary: 복수인 확인 승인
      description: |
        화면 13. 승인이 완료되어야 해당 청구를 확정할 수 있다 (INV-4).
        판정을 수행한 심사자 본인은 승인할 수 없다 (직무 분리).
      operationId: approveDualCheck
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                note: { type: string, description: 반려 시 사유 }
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 승인 권한 없음 · 본인이 판정한 건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rules:
    get:
      tags: [Admin]
      summary: 룰·약관 조항 목록
      description: 화면 14. 룰별 근거 생성 건수와 기각률을 함께 반환한다.
      operationId: listRules
      parameters:
        - name: coverageType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CoverageType' }
        - name: activeOnly
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [REJECTION_RATE_DESC, UPDATED_DESC, CODE_ASC]
            default: REJECTION_RATE_DESC
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleWithStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Admin]
      summary: 룰 등록
      description: 화면 14. 신규 룰은 `version = 1`로 생성된다.
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/rules/{ruleId}:
    put:
      tags: [Admin]
      summary: 룰 수정 (새 버전 생성)
      description: |
        화면 14. 기존 레코드를 갱신하지 않고 `version`을 1 증가시킨 새 레코드를 생성한다.
        이미 생성된 `evidences`는 생성 당시의 룰 버전을 참조하므로 과거 판정의 근거는 변하지 않는다 (설계 원칙 3).
      operationId: updateRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleRequest' }
      responses:
        '201':
          description: 새 버전 생성 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Admin]
      summary: 룰 비활성화
      description: |
        화면 14. 물리 삭제하지 않고 `active = false`로 전환한다.
        비활성화된 룰은 새 근거를 생성하지 않으나 기존 근거의 참조는 유지된다.
      operationId: deactivateRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '204':
          description: 비활성화 완료
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ══════════════════════════════════════════════
  # External
  # ══════════════════════════════════════════════

  /external/claims/{claimId}/recommendations:
    post:
      tags: [External]
      summary: AI 모델 권고 및 기여도 전달
      description: |
        AI 심사 모델이 항목별 보상제외 확률과 기여도를 전달한다.
        `ai_recommendations`와 `evidences`(source = AI)를 생성한다.

        **이 엔드포인트는 판정을 확정하지 않는다 (INV-13).**
        `reviews`, `interventions`, `claims.status`에 접근할 수 없다.
      operationId: submitRecommendations
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelName, modelVersion, threshold, items]
              properties:
                modelName: { type: string, example: claim-risk }
                modelVersion: { type: string, example: v2.3 }
                threshold: { type: number, format: double, example: 0.3 }
                items:
                  type: array
                  items:
                    type: object
                    required: [claimItemId, exclusionProbability, contributions]
                    properties:
                      claimItemId: { type: integer, format: int64 }
                      exclusionProbability: { type: number, format: double }
                      contributions:
                        type: array
                        description: 항목별 새플리 기여도
                        items:
                          type: object
                          properties:
                            feature: { type: string, example: 동일 상병 30일 내 재청구 }
                            value: { type: number, format: double, example: 0.31 }
                            polarity: { $ref: '#/components/schemas/Polarity' }
      responses:
        '201':
          description: 권고 등록 완료
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 판정 확정 시도 등 허용되지 않은 쓰기 (E-11, INV-13)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /external/documents/{documentId}/ocr:
    post:
      tags: [External]
      summary: OCR 결과 전달
      description: |
        서류 OCR 결과를 전달한다. 추출된 진료 항목으로 `claim_items`를 생성한다 (D-8).
        항목 생성은 판정이 아니므로 INV-13과 충돌하지 않는다.
      operationId: submitOcrResult
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, items]
              properties:
                status:
                  type: string
                  enum: [DONE, FAILED]
                rawResult: { type: object, description: OCR 원문 }
                items:
                  type: array
                  items:
                    type: object
                    required: [name, isCovered, quantity, claimedAmount]
                    properties:
                      name: { type: string, example: 도수치료 }
                      procedureCode: { type: string, example: MM101 }
                      isCovered: { type: boolean }
                      quantity: { type: integer }
                      claimedAmount: { type: integer }
      responses:
        '201':
          description: OCR 결과 반영 완료
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /external/policies/{policyId}:
    get:
      tags: [External]
      summary: 계약·담보 정보 연계
      description: 계약 원장 시스템에서 조회한다. 조회 전용이다.
      operationId: getPolicyExternal
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '404': { $ref: '#/components/responses/NotFound' }


# ══════════════════════════════════════════════
components:
# ══════════════════════════════════════════════

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 요청 값 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ── 공통 ──────────────────────────────────

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: OVERRIDE_REASON_REQUIRED }
        message: { type: string, example: AI 권고와 다른 판정에는 오버라이드 사유가 필요합니다 }
        invariant:
          type: string
          description: 위반된 불변조건 번호
          example: INV-3
        details:
          type: object
          description: 위반 상세. 오류 유형에 따라 구조가 다르다
        timestamp: { type: string, format: date-time }

    PagedResponse:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, example: 1 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, example: 24 }
        totalPages: { type: integer, example: 2 }

    # ── Enum ──────────────────────────────────

    ClaimStatus:
      type: string
      enum: [RECEIVED, UNDER_REVIEW, DECIDED, OBJECTION, CLOSED]
    ItemDecision:
      type: string
      enum: [PAY, PARTIAL, DENY]
    CoverageType:
      type: string
      enum: [DISEASE_COVERED, DISEASE_UNCOVERED, INJURY_COVERED, INJURY_UNCOVERED]
    EvidenceSource:
      type: string
      enum: [AI, RULE, MANUAL]
    EvidenceStatus:
      type: string
      enum: [GENERATED, ADOPTED, REJECTED]
    Polarity:
      type: string
      enum: [POSITIVE, NEGATIVE]
    DisclosureLevel:
      type: string
      enum: [INTERNAL, CUSTOMER]
    RejectionReasonType:
      type: string
      enum: [RULE_MISAPPLIED, DOCUMENT_MISMATCH, TERMS_INTERPRETATION, DUPLICATE, OTHER]
    OverrideReasonType:
      type: string
      enum: [DOCUMENT_MISMATCH, TERMS_INTERPRETATION, MODEL_FALSE_POSITIVE, OTHER]
    InterventionType:
      type: string
      enum: [OVERRIDE, DUAL_CHECK, ESCALATION]
    ExplanationType:
      type: string
      enum: [GLOBAL, LOCAL]
    ExplanationStatus:
      type: string
      enum: [REQUESTED, GENERATING, PROVIDED, OVERDUE]
    ObjectionStatus:
      type: string
      enum: [RECEIVED, REVIEWING, ANSWERED]
    DocumentType:
      type: string
      enum: [RECEIPT, DETAIL, CONFIRMATION, OPINION, OTHER]

    # ── 세션 ──────────────────────────────────

    InternalSession:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        empNo: { type: string, example: M2026043 }
        name: { type: string, example: 김영희 }
        role: { type: string, enum: [REVIEWER, REVIEW_MANAGER] }
        landingScreen:
          type: string
          description: role에 따른 진입 화면
          enum: [REVIEW_QUEUE, INTERVENTION_MONITOR]

    CustomerSession:
      type: object
      properties:
        customerId: { type: integer, format: int64 }
        name: { type: string, example: 김철수 }

    # ── 계약 ──────────────────────────────────

    Policy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policyNo: { type: string, example: POL-2021-8830142 }
        productName: { type: string, example: 종합실손의료비보험 4세대 }
        startedOn: { type: string, format: date }
        endedOn: { type: string, format: date, nullable: true }
        coverages:
          type: array
          items: { $ref: '#/components/schemas/Coverage' }

    Coverage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: 질병 비급여 통원 }
        type: { $ref: '#/components/schemas/CoverageType' }
        limitAmount: { type: integer, example: 200000 }
        annualLimit: { type: integer, nullable: true, example: 100 }
        deductibleRate: { type: number, format: double, example: 0.3 }
        exemptionUntil: { type: string, format: date, nullable: true }

    # ── 청구 ──────────────────────────────────

    ClaimSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        claimNo: { type: string, example: CLM-2026-0908-00412 }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        hospitalName: { type: string }
        claimedTotal: { type: integer, example: 1284000 }
        paidTotal: { type: integer, example: 504000 }
        itemCount: { type: integer, example: 4 }
        receivedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }

    ClaimDetailCustomer:
      description: |
        화면 4 응답. 고객용 근거만 포함한다 (INV-9).
      allOf:
        - $ref: '#/components/schemas/ClaimSummary'
        - type: object
          properties:
            productName: { type: string }
            treatedFrom: { type: string, format: date }
            treatedTo: { type: string, format: date }
            items:
              type: array
              items: { $ref: '#/components/schemas/ClaimItemCustomer' }
            hasExplanation: { type: boolean }
            hasObjection: { type: boolean }

    ClaimDetailInternal:
      description: 화면 9 응답. 내부용 정보를 포함한다.
      allOf:
        - $ref: '#/components/schemas/ClaimSummary'
        - type: object
          properties:
            policyNo: { type: string }
            productName: { type: string }
            diagnosisCode: { type: string, example: M54.5 }
            treatedFrom: { type: string, format: date }
            treatedTo: { type: string, format: date }
            customerMemo: { type: string, nullable: true }
            customerName: { type: string }
            assigneeName: { type: string }
            assignedAt: { type: string, format: date-time }
            documentCount: { type: integer }
            maxExclusionProbability: { type: number, format: double, example: 0.82 }
            dualCheckRequired: { type: boolean }
            dualCheckApproved: { type: boolean, nullable: true }
            appliedPolicies:
              type: array
              items:
                type: object
                properties:
                  code: { type: string, example: P-07 }
                  name: { type: string, example: 비급여 고액 항목 }

    ClaimItem:
      description: 화면 9 항목. AI 권고와 현재 판정을 함께 반환한다.
      type: object
      properties:
        id: { type: integer, format: int64 }
        seq: { type: integer, example: 2 }
        name: { type: string, example: 도수치료 }
        procedureCode: { type: string, nullable: true }
        isCovered: { type: boolean }
        quantity: { type: integer, example: 12 }
        claimedAmount: { type: integer, example: 480000 }
        coverageName: { type: string }
        recommendation: { $ref: '#/components/schemas/AiRecommendation' }
        currentReview:
          allOf: [{ $ref: '#/components/schemas/Review' }]
          nullable: true
        evidenceCount:
          type: object
          properties:
            adopted: { type: integer }
            rejected: { type: integer }
            pending: { type: integer }
            adoptedNegative: { type: integer, description: INV-5 사전 확인용 }

    ClaimItemCustomer:
      description: 화면 4 항목. 고객용 근거만 포함한다.
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        quantity: { type: integer }
        claimedAmount: { type: integer }
        decision: { $ref: '#/components/schemas/ItemDecision' }
        paidAmount: { type: integer }
        reasons:
          type: array
          items:
            type: object
            properties:
              polarity: { $ref: '#/components/schemas/Polarity' }
              content: { type: string, description: evidences.content_customer }
              source: { type: string, description: 약관 조항 또는 서류명 }

    Document:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/DocumentType' }
        name: { type: string }
        fileUrl: { type: string }
        sizeBytes: { type: integer }
        ocrStatus: { type: string, enum: [PENDING, DONE, FAILED] }
        uploadedAt: { type: string, format: date-time }

    QueueItem:
      description: 화면 8 목록 행
      type: object
      properties:
        claimId: { type: integer, format: int64 }
        claimNo: { type: string }
        customerName: { type: string }
        customerBirthYear: { type: integer, example: 85 }
        coverageType: { $ref: '#/components/schemas/CoverageType' }
        diagnosisCode: { type: string }
        claimedTotal: { type: integer }
        itemCount: { type: integer }
        maxExclusionProbability: { type: number, format: double }
        dualCheckRequired: { type: boolean }
        hasObjection: { type: boolean }
        receivedAt: { type: string, format: date-time }
        elapsedHours: { type: integer }

    # ── AI 권고 · 근거 · 판정 ─────────────────

    AiRecommendation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        modelName: { type: string, example: claim-risk }
        modelVersion: { type: string, example: v2.3 }
        exclusionProbability: { type: number, format: double, example: 0.82 }
        recommendation: { $ref: '#/components/schemas/ItemDecision' }
        threshold: { type: number, format: double, example: 0.3 }
        isLatest: { type: boolean }
        createdAt: { type: string, format: date-time }

    Evidence:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source: { $ref: '#/components/schemas/EvidenceSource' }
        polarity: { $ref: '#/components/schemas/Polarity' }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        disclosureLevel: { $ref: '#/components/schemas/DisclosureLevel' }
        contentInternal: { type: string }
        contentCustomer: { type: string, nullable: true }
        contribution:
          type: number
          format: double
          nullable: true
          description: source = AI 인 경우 새플리 기여도
        targetAmount: { type: integer, nullable: true }
        rule:
          type: object
          nullable: true
          properties:
            code: { type: string, example: R-0412 }
            version: { type: integer, example: 4 }
            articleNo: { type: string, example: 제12조 3항 }
            articleText: { type: string }
        documentName: { type: string, nullable: true }
        rejectionReasonType:
          allOf: [{ $ref: '#/components/schemas/RejectionReasonType' }]
          nullable: true
        rejectionNote: { type: string, nullable: true }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }

    ReviewRequest:
      type: object
      required: [decision, paidAmount, reason]
      properties:
        decision: { $ref: '#/components/schemas/ItemDecision' }
        paidAmount: { type: integer, minimum: 0, example: 240000 }
        reason:
          type: string
          minLength: 1
          description: 판정 사유. 필수 (INV-2)
        overrideReasonType:
          allOf: [{ $ref: '#/components/schemas/OverrideReasonType' }]
          description: AI 권고와 다른 판정인 경우 필수 (INV-3)
        overrideReason:
          type: string
          description: 오버라이드 상세 사유. 유형 선택 시 함께 저장된다

    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        claimItemId: { type: integer, format: int64 }
        decision: { $ref: '#/components/schemas/ItemDecision' }
        paidAmount: { type: integer }
        reason: { type: string }
        isCurrent: { type: boolean }
        supersededBy: { type: integer, format: int64, nullable: true }
        reviewerId: { type: integer, format: int64 }
        reviewerName: { type: string }
        decidedAt: { type: string, format: date-time }
        intervention:
          allOf: [{ $ref: '#/components/schemas/Intervention' }]
          nullable: true
          description: 이 판정과 함께 생성된 개입 기록 (D-7)

    DecisionResult:
      type: object
      properties:
        claimId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        paidTotal: { type: integer }
        decidedAt: { type: string, format: date-time }
        itemDecisions:
          type: array
          items:
            type: object
            properties:
              claimItemId: { type: integer, format: int64 }
              decision: { $ref: '#/components/schemas/ItemDecision' }
              paidAmount: { type: integer }
        overrideCount: { type: integer, description: 이 청구에서 발생한 오버라이드 건수 }

    # ── 개입 ──────────────────────────────────

    Intervention:
      type: object
      properties:
        id: { type: integer, format: int64 }
        claimId: { type: integer, format: int64 }
        claimItemId: { type: integer, format: int64, nullable: true }
        type: { $ref: '#/components/schemas/InterventionType' }
        overrideReasonType:
          allOf: [{ $ref: '#/components/schemas/OverrideReasonType' }]
          nullable: true
        reason: { type: string }
        actorId: { type: integer, format: int64 }
        actorName: { type: string }
        approved: { type: boolean, nullable: true }
        policyCode: { type: string, nullable: true, example: P-07 }
        recommendation:
          type: object
          nullable: true
          description: 뒤집힌 AI 권고 (D-1)
          properties:
            decision: { $ref: '#/components/schemas/ItemDecision' }
            exclusionProbability: { type: number, format: double }
        occurredAt: { type: string, format: date-time }

    PolicyRequest:
      type: object
      required: [name, conditions, requiredIntervention, approverRoles, active]
      properties:
        name: { type: string, maxLength: 100 }
        active: { type: boolean }
        conditions:
          type: array
          minItems: 1
          description: 모든 조건이 AND로 결합된다
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                enum: [COVERAGE_TYPE, ITEM_CLAIMED_AMOUNT, EXCLUSION_PROBABILITY, CLAIM_TOTAL, ITEM_COUNT]
              operator:
                type: string
                enum: [EQ, NE, GTE, LTE, IN]
              value: { type: string, example: "300000" }
        requiredIntervention: { $ref: '#/components/schemas/InterventionType' }
        approverRoles:
          type: array
          items: { type: string, enum: [REVIEW_MANAGER, REVIEW_LEAD, COMPLIANCE] }

    InterventionPolicy:
      allOf:
        - $ref: '#/components/schemas/PolicyRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            code: { type: string, example: P-07 }
            authorName: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time, nullable: true }
            stats:
              type: object
              description: 최근 30일 기준
              properties:
                triggeredCount: { type: integer, example: 218 }
                triggeredRate: { type: number, format: double, example: 0.17 }
                medianApprovalMinutes: { type: integer, example: 82 }
                rejectionRate: { type: number, format: double, example: 0.032 }

    InterventionSummary:
      description: 화면 13 집계
      type: object
      properties:
        periodDays: { type: integer, example: 30 }
        adoptionRate: { type: number, format: double, example: 0.874 }
        overrideCount: { type: integer, example: 162 }
        pendingApprovalCount: { type: integer, example: 6 }
        evidenceRejectionRate: { type: number, format: double, example: 0.112 }
        byReviewer:
          type: array
          items:
            type: object
            properties:
              reviewerId: { type: integer, format: int64 }
              empNo: { type: string }
              name: { type: string }
              reviewCount: { type: integer }
              adoptionRate: { type: number, format: double }
              medianDurationSeconds: { type: integer }
              evidenceUnopenedRate:
                type: number
                format: double
                description: 근거 카드를 열지 않고 확정한 비율
        durationDistribution:
          type: array
          description: 판정 소요시간 분포 (히스토그램 구간별 건수)
          items:
            type: object
            properties:
              bucketLabel: { type: string, example: 0-30초 }
              count: { type: integer }
        byRejectionReason:
          type: array
          description: 근거 기각 사유 집계. 룰·모델 개선의 입력이 된다
          items:
            type: object
            properties:
              type: { $ref: '#/components/schemas/RejectionReasonType' }
              count: { type: integer }
              ratio: { type: number, format: double }
              topRuleCode: { type: string, nullable: true }
              topRuleRejectionRate: { type: number, format: double, nullable: true }

    # ── 룰 ────────────────────────────────────

    RuleRequest:
      type: object
      required: [name, coverageType, articleNo, articleText, polarity, conditionExpr, contentInternal, contentCustomer, defaultDisclosureLevel]
      properties:
        name: { type: string, maxLength: 100 }
        coverageType: { $ref: '#/components/schemas/CoverageType' }
        articleNo: { type: string, example: 제12조 3항 }
        articleText: { type: string }
        polarity: { $ref: '#/components/schemas/Polarity' }
        conditionExpr: { type: string, description: 적용 조건식 }
        contentInternal: { type: string, description: 심사자용 근거 문구 }
        contentCustomer: { type: string, description: 고객 설명문용 문구 }
        defaultDisclosureLevel: { $ref: '#/components/schemas/DisclosureLevel' }
        changeNote: { type: string, description: 이 버전의 변경 내용 }

    Rule:
      allOf:
        - $ref: '#/components/schemas/RuleRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            code: { type: string, example: R-0412 }
            version: { type: integer, example: 4 }
            active: { type: boolean }
            authorName: { type: string }
            createdAt: { type: string, format: date-time }

    RuleWithStats:
      allOf:
        - $ref: '#/components/schemas/Rule'
        - type: object
          properties:
            stats:
              type: object
              properties:
                generatedCount: { type: integer, example: 312 }
                rejectionRate: { type: number, format: double, example: 0.682 }
                byRejectionReason:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { $ref: '#/components/schemas/RejectionReasonType' }
                      count: { type: integer }
            versions:
              type: array
              description: 버전 이력
              items:
                type: object
                properties:
                  version: { type: integer }
                  changeNote: { type: string }
                  authorName: { type: string }
                  createdAt: { type: string, format: date-time }

    # ── 설명 · 이의제기 ───────────────────────

    Explanation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        claimId: { type: integer, format: int64, nullable: true }
        type: { $ref: '#/components/schemas/ExplanationType' }
        status: { $ref: '#/components/schemas/ExplanationStatus' }
        modelName: { type: string, nullable: true }
        body: { type: string, nullable: true }
        fileUrl: { type: string, nullable: true }
        draftedBy: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        dueDate:
          type: string
          format: date
          nullable: true
          description: type = LOCAL 인 경우 필수 (INV-8)
        providedAt: { type: string, format: date-time, nullable: true }

    Objection:
      type: object
      properties:
        id: { type: integer, format: int64 }
        claimId: { type: integer, format: int64 }
        targetItems:
          type: array
          items:
            type: object
            properties:
              claimItemId: { type: integer, format: int64 }
              name: { type: string }
              decision: { $ref: '#/components/schemas/ItemDecision' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/ObjectionStatus' }
        reviewerName:
          type: string
          nullable: true
          description: 재검토 심사자. 최초 판정자와 다르다
        response: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
